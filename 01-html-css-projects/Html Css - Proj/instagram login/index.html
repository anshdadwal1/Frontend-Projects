<!DOCTYPE html>
<html>
<head>
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="page1">
        <div id="box1">
            <img src="images/Screenshot 2025-06-19 195527.png" alt="Instagram preview">
        </div>
        <div id="box2">
            <div id="lbox">
                <h1 id="insta">Instagram</h1>
                <div id="form">
                    <input type="text" placeholder="Phone number, username or email" class="input-box">
                    <input type="password" placeholder="Password" class="input-box">
                    <input type="button" value="Log in">
                </div>
                <div class="facebook">Log in with Facebook</div>
                <div id="pass">Forgot Password?</div>
            </div>
            <div id="sbox">
                <span>Don't have an account? <b><a id="signup">Sign up</a></b></span>
            </div>
        </div>
    </div>
</body>
</html>
